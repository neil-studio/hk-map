<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案二：顶部通栏筛选矩阵 + 左右 Split 对比视图（专业列报风）</title>

<!-- Leaflet CSS & Google Fonts -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-header: #0f172a;
    --bg-main: #f8fafc;
    --panel-border: #e2e8f0;
    --brand-accent: #2563eb;
    --text-main: #0f172a;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', 'DM Sans', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Full Width Header & Filter Bar */
  header {
    background: var(--bg-header);
    color: #fff;
    padding: 12px 24px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }

  .header-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand-title {
    font-size: 1.1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge-split {
    background: #38bdf8;
    color: #0f172a;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
  }

  /* Full Width Matrix Filter Grid */
  .filter-matrix-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr) 1.5fr;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .filter-matrix-item label {
    display: block;
    font-size: 0.7rem;
    color: #94a3b8;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .select-matrix {
    width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #fff;
    font-size: 0.78rem;
    outline: none;
  }

  .input-search-matrix {
    width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #fff;
    font-size: 0.78rem;
    outline: none;
  }

  /* Split Container (50:50 Dual Panels) */
  .split-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Left 50% Panel: Grid Cards */
  .left-cards-panel {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    border-right: 1px solid var(--panel-border);
    background: #f8fafc;
  }

  .cards-grid-2col {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .split-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .split-card:hover {
    border-color: var(--brand-accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(37,99,235,0.08);
  }

  .card-top-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 4px;
  }

  .card-price-badge {
    font-size: 0.9rem;
    font-weight: 700;
    color: #2563eb;
    margin-top: 6px;
  }

  .card-sub-info {
    font-size: 0.75rem;
    color: #64748b;
    margin-top: 4px;
  }

  /* Right 50% Panel: Sticky Map */
  .right-map-panel {
    flex: 1;
    height: 100%;
    position: relative;
  }

  #map {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<header>
  <div class="header-top-bar">
    <div class="brand-title">
      <span>🏢 香港一手新盘决策看板</span>
      <span class="badge-split">方案二：顶部通栏筛选 + 50:50 左右 Split</span>
    </div>
    <div style="font-size: 0.78rem; color: #94a3b8;">
      找到匹配新盘：<strong style="color: #38bdf8;" id="split-count">0</strong> 个
    </div>
  </div>

  <!-- Top Filter Matrix -->
  <div class="filter-matrix-grid">
    <div class="filter-matrix-item">
      <label>🎓 大学 / 校网</label>
      <select class="select-matrix" id="anchor-school" onchange="onAnchorSelect('school')">
        <option value="">-- 不限 --</option>
      </select>
    </div>

    <div class="filter-matrix-item">
      <label>🚇 港铁站</label>
      <select class="select-matrix" id="anchor-mtr" onchange="onAnchorSelect('mtr')">
        <option value="">-- 不限 --</option>
      </select>
    </div>

    <div class="filter-matrix-item">
      <label>🏙️ 核心商圈</label>
      <select class="select-matrix" id="anchor-district" onchange="onAnchorSelect('district')">
        <option value="">-- 不限 --</option>
      </select>
    </div>

    <div class="filter-matrix-item">
      <label>💷 总价预算</label>
      <select class="select-matrix" id="price-select">
        <option value="all">不限总价</option>
        <option value="1000-down">1000万以内</option>
        <option value="1000-2000">1000-2000万</option>
        <option value="2000-5000">2000-5000万</option>
        <option value="5000-up">5000万以上</option>
      </select>
    </div>

    <div class="filter-matrix-item">
      <label>🔍 搜索关键字</label>
      <input class="input-search-matrix" placeholder="搜楼盘/两房/800万/启德...">
    </div>
  </div>
</header>

<div class="split-body">
  <!-- Left 50%: 2-Column Cards Grid -->
  <div class="left-cards-panel">
    <div class="cards-grid-2col" id="split-cards-grid"></div>
  </div>

  <!-- Right 50%: Map View -->
  <div class="right-map-panel">
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let landmarksData = [];
let projectsData = [];
let map, currentAnchorMarker, currentRadiusCircle;

document.addEventListener('DOMContentLoaded', async () => {
  initMap();
  await loadData();
});

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([22.3150, 114.1750], 12);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2agc_1_eee20b45a89c95d86e5610c5', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);
}

async function loadData() {
  const r1 = await fetch('hk_landmarks.json');
  landmarksData = await r1.json();
  const r2 = await fetch('hk_project_coords.json');
  projectsData = await r2.json();

  populateSelects();
  renderProjects();
}

function populateSelects() {
  const sSchool = document.getElementById('anchor-school');
  const sMtr = document.getElementById('anchor-mtr');
  const sDistrict = document.getElementById('anchor-district');

  landmarksData.forEach(lm => {
    const opt = document.createElement('option');
    opt.value = lm.id;
    opt.textContent = lm.name;

    if (lm.category === 'university' || lm.category === 'school_net') sSchool.appendChild(opt);
    else if (lm.category === 'mtr') sMtr.appendChild(opt);
    else if (lm.category === 'district') sDistrict.appendChild(opt);
  });
}

function onAnchorSelect(type) {
  const sSchool = document.getElementById('anchor-school');
  const sMtr = document.getElementById('anchor-mtr');
  const sDistrict = document.getElementById('anchor-district');

  let id = '';
  if (type === 'school') { id = sSchool.value; sMtr.value = ''; sDistrict.value = ''; }
  else if (type === 'mtr') { id = sMtr.value; sSchool.value = ''; sDistrict.value = ''; }
  else if (type === 'district') { id = sDistrict.value; sSchool.value = ''; sMtr.value = ''; }

  if (currentAnchorMarker) map.removeLayer(currentAnchorMarker);
  if (currentRadiusCircle) map.removeLayer(currentRadiusCircle);

  if (id) {
    const lm = landmarksData.find(x => x.id === id);
    if (lm) {
      currentRadiusCircle = L.circle([lm.lat, lm.lng], {
        radius: 1500, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.1, weight: 2, dashArray: '5,5'
      }).addTo(map);

      map.fitBounds(currentRadiusCircle.getBounds(), { padding: [40, 40] });

      const icon = L.divIcon({
        className: 'anchor-pin',
        html: `<div style="background:#dc2626; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold; box-shadow:0 4px 12px rgba(220,38,38,0.4); border:2px solid #fff; white-space:nowrap;">📍 ${lm.name}</div>`,
        iconSize: [160, 32], iconAnchor: [80, 16]
      });
      currentAnchorMarker = L.marker([lm.lat, lm.lng], { icon }).addTo(map);
    }
  }
}

function renderProjects() {
  const grid = document.getElementById('split-cards-grid');
  document.getElementById('split-count').textContent = projectsData.length;
  grid.innerHTML = '';

  projectsData.forEach(proj => {
    const card = document.createElement('div');
    card.className = 'split-card';
    card.innerHTML = `
      <div>
        <div class="card-top-title">${proj.name}</div>
        <div class="card-sub-info">📍 ${proj.region} - ${proj.district}</div>
        <div class="card-price-badge">${((proj.is_coming_soon || ["coming_soon", "sales_suspended", "registration"].includes(proj.sell_status) || ["即將發售", "即将发售", "暫停銷售", "暂停销售", "筹备中"].includes(proj.sell_status_cn)) ? (proj.total_price_desc || "售價待定") : (proj.total_price_desc || (proj.min_price_wan ? proj.min_price_wan + "万起" : "售價待定")))}</div>
      </div>
      <div style="font-size:0.72rem; color:#64748b; margin-top:8px; line-height:1.4;">在售: ${proj.sale_units}套 | 已售: ${proj.sold_units}套</div>
    `;

    card.addEventListener('click', () => {
      map.flyTo([proj.lat, proj.lng], 15, { duration: 1 });
    });

    grid.appendChild(card);

    const mIcon = L.divIcon({
      className: 'p-marker',
      html: `<div style="background:#16a34a; color:#fff; padding:3px 7px; border-radius:6px; font-size:11px; font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,0.25); border:1.5px solid #fff;">${proj.name}</div>`,
      iconSize: [80, 22], iconAnchor: [40, 11]
    });
    L.marker([proj.lat, proj.lng], { icon: mIcon }).addTo(map);
  });
}
</script>
</body>
</html>
