<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 2：顶置指令中心 + 4:6 双栏 + 底部固定导出栏（正式版配色）</title>

<!-- Leaflet CSS & Google Fonts -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* 正式版 1.0 经典撞色标准 */
    --color-sale-bg: #A9F5A9;
    --color-sale-fg: #004D00;
    --color-priced-bg: #A9D0F5;
    --color-priced-fg: #002060;
    --color-sold-bg: #F5A9A9;
    --color-sold-fg: #660000;
    --color-stopped-bg: #FFC000;
    --color-stopped-fg: #000000;

    --brand-header: #1e3a8a;
    --bg-main: #f8fafc;
    --panel-border: #cbd5e1;
    --text-primary: #0f172a;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', 'DM Sans', sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header Control Center Bar */
  header {
    background: var(--brand-header);
    color: #ffffff;
    padding: 12px 24px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand-title {
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge-tag {
    background: #38bdf8;
    color: #0f172a;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
  }

  /* Full Width Matrix Control Bar */
  .control-center-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr) 1.2fr 1fr;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .control-item label {
    display: block;
    font-size: 0.7rem;
    color: #cbd5e1;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .select-ctrl {
    width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #fff;
    font-size: 0.78rem;
    outline: none;
  }

  .price-inputs-flex {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .input-ctrl-num {
    width: 75px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #fff;
    font-size: 0.76rem;
    outline: none;
  }

  /* Main Split 4:6 Container */
  .main-split-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* Left 40% Cards List */
  .left-cards-40 {
    width: 40%;
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    background: #f8fafc;
    overflow-y: auto;
    padding: 14px;
  }

  .cards-grid-wrapper {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .project-card-official {
    background: #ffffff;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .project-card-official:hover {
    border-color: #2563eb;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }

  .project-card-official.selected {
    border-color: #d97706;
    background: #fffbeb;
  }

  .card-official-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-official-title {
    font-size: 0.96rem;
    font-weight: 700;
    color: var(--brand-header);
  }

  .status-tag-sale {
    background: var(--color-sale-bg);
    color: var(--color-sale-fg);
    font-weight: 700;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .status-tag-priced {
    background: var(--color-priced-bg);
    color: var(--color-priced-fg);
    font-weight: 600;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .price-highlight-blue {
    font-size: 0.92rem;
    font-weight: 700;
    color: #2563eb;
    margin-top: 6px;
  }

  .dist-badge-red {
    display: inline-block;
    background: #fee2e2;
    color: #991b1b;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 6px;
  }

  /* Right 60% Map Panel */
  .right-map-60 {
    width: 60%;
    height: 100%;
    position: relative;
  }

  #map { width: 100%; height: 100%; }

  /* Bottom Sticky Export Bar */
  .bottom-sticky-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: #0f172a;
    color: #ffffff;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.2);
    border-top: 1px solid #334155;
  }

  .btn-sticky-export {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand-title">
      <span>🏢 香港一手新盘指令看板</span>
      <span class="badge-tag">方案 2：顶置指令中心 + 4:6 双栏 + 底部吸附栏（正式版配色）</span>
    </div>
    <div style="font-size:0.8rem; color:#cbd5e1;">
      匹配结果：<strong style="color:#38bdf8;" id="count-num">0</strong> 个楼盘
    </div>
  </div>

  <!-- Command Center Filter Bar -->
  <div class="control-center-grid">
    <div class="control-item">
      <label>🎓 大学 / 校网</label>
      <select class="select-ctrl" id="anchor-school" onchange="onAnchorSelect('school')">
        <option value="">-- 不限 --</option>
      </select>
    </div>

    <div class="control-item">
      <label>🚇 重点港铁站</label>
      <select class="select-ctrl" id="anchor-mtr" onchange="onAnchorSelect('mtr')">
        <option value="">-- 不限 --</option>
      </select>
    </div>

    <div class="control-item">
      <label>🏙️ 核心商圈</label>
      <select class="select-ctrl" id="anchor-district" onchange="onAnchorSelect('district')">
        <option value="">-- 不限 --</option>
      </select>
    </div>

    <div class="control-item">
      <label>💷 自定义预算 (万)</label>
      <div class="price-inputs-flex">
        <input type="number" class="input-ctrl-num" id="p-min" placeholder="最低" oninput="applyFilters()">
        <span>-</span>
        <input type="number" class="input-ctrl-num" id="p-max" placeholder="最高" oninput="applyFilters()">
      </div>
    </div>

    <div class="control-item">
      <label>🔍 搜楼盘名称/关键字</label>
      <input type="text" class="select-ctrl" id="search-input" placeholder="输入搜索..." oninput="applyFilters()">
    </div>
  </div>
</header>

<div class="main-split-area">
  <!-- Left 40%: Cards List -->
  <div class="left-cards-40">
    <div class="cards-grid-wrapper" id="cards-container"></div>
  </div>

  <!-- Right 60%: Map -->
  <div class="right-map-60">
    <div id="map"></div>
  </div>

  <!-- Bottom Sticky Export Bar -->
  <div class="bottom-sticky-bar">
    <div>
      已选楼盘：<strong style="color:#f59e0b;" id="select-count-text">0</strong> 个
    </div>
    <button class="btn-sticky-export" onclick="alert('即将生成 PDF 方案')">
      📄 导出定制 PDF 推荐报告
    </button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let landmarksData = [], projectsData = [];
let map, currentAnchorMarker, currentRadiusCircle, activeAnchorLandmark = null;
let selectedNames = new Set();

document.addEventListener('DOMContentLoaded', async () => {
  initMap();
  await loadData();
});

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([22.3150, 114.1750], 12);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2agc_1_eee20b45a89c95d86e5610c5', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);
}

async function loadData() {
  const r1 = await fetch('hk_landmarks.json');
  landmarksData = await r1.json();
  const r2 = await fetch('hk_project_coords.json');
  projectsData = await r2.json();

  populateSelects();
  applyFilters();
}

function populateSelects() {
  const sSchool = document.getElementById('anchor-school');
  const sMtr = document.getElementById('anchor-mtr');
  const sDistrict = document.getElementById('anchor-district');

  landmarksData.forEach(lm => {
    const opt = document.createElement('option');
    opt.value = lm.id;
    opt.textContent = lm.name;

    if (lm.category === 'university' || lm.category === 'school_net') sSchool.appendChild(opt);
    else if (lm.category === 'mtr') sMtr.appendChild(opt);
    else if (lm.category === 'district') sDistrict.appendChild(opt);
  });
}

function onAnchorSelect(type) {
  const sSchool = document.getElementById('anchor-school');
  const sMtr = document.getElementById('anchor-mtr');
  const sDistrict = document.getElementById('anchor-district');

  let id = '';
  if (type === 'school') { id = sSchool.value; sMtr.value = ''; sDistrict.value = ''; }
  else if (type === 'mtr') { id = sMtr.value; sSchool.value = ''; sDistrict.value = ''; }
  else if (type === 'district') { id = sDistrict.value; sSchool.value = ''; sMtr.value = ''; }

  if (currentAnchorMarker) map.removeLayer(currentAnchorMarker);
  if (currentRadiusCircle) map.removeLayer(currentRadiusCircle);

  if (id) {
    const lm = landmarksData.find(x => x.id === id);
    activeAnchorLandmark = lm;
    if (lm) {
      currentRadiusCircle = L.circle([lm.lat, lm.lng], {
        radius: 1500, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.08, weight: 2, dashArray: '6,6'
      }).addTo(map);

      map.fitBounds(currentRadiusCircle.getBounds(), { padding: [40, 40] });

      const icon = L.divIcon({
        className: 'anchor-pin',
        html: `<div style="background:#dc2626; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold; box-shadow:0 4px 12px rgba(220,38,38,0.4); border:2px solid #fff; white-space:nowrap;">📍 ${lm.name}</div>`,
        iconSize: [160, 32], iconAnchor: [80, 16]
      });
      currentAnchorMarker = L.marker([lm.lat, lm.lng], { icon }).addTo(map);
    }
  } else {
    activeAnchorLandmark = null;
  }
  applyFilters();
}

function getDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function applyFilters() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';

  const searchKey = document.getElementById('search-input').value.trim().toLowerCase();
  const pMin = parseFloat(document.getElementById('p-min').value);
  const pMax = parseFloat(document.getElementById('p-max').value);

  let filtered = projectsData.filter(proj => {
    if (searchKey) {
      if (!proj.name.toLowerCase().includes(searchKey) && !proj.district.toLowerCase().includes(searchKey)) return false;
    }
    const minP = proj.min_price_wan || 0;
    const maxP = proj.max_price_wan || 99999;
    if (!isNaN(pMin) && maxP < pMin) return false;
    if (!isNaN(pMax) && minP > pMax) return false;

    return true;
  });

  document.getElementById('count-num').textContent = filtered.length;

  filtered.forEach(proj => {
    let distKmStr = '';
    if (activeAnchorLandmark) {
      const d = getDistanceKm(activeAnchorLandmark.lat, activeAnchorLandmark.lng, proj.lat, proj.lng);
      distKmStr = `${d.toFixed(1)} km`;
    }

    const card = document.createElement('div');
    card.className = `project-card-official ${selectedNames.has(proj.name) ? 'selected' : ''}`;
    card.innerHTML = `
      <div class="card-official-top">
        <span class="card-official-title">${proj.name}</span>
        <span class="${proj.sell_status === 'on_sale' ? 'status-tag-sale' : 'status-tag-priced'}">${proj.sell_status_cn}</span>
      </div>
      <div class="price-highlight-blue">${((proj.is_coming_soon || ["coming_soon", "sales_suspended", "registration"].includes(proj.sell_status) || ["即將發售", "即将发售", "暫停銷售", "暂停销售", "筹备中"].includes(proj.sell_status_cn)) ? (proj.total_price_desc || "售價待定") : (proj.total_price_desc || (proj.min_price_wan ? proj.min_price_wan + "万起" : "售價待定")))}</div>
      <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">📍 ${proj.district} | 在售 ${proj.sale_units}套</div>
      ${distKmStr ? `<div class="dist-badge-red">📍 距${activeAnchorLandmark.name.split(' ')[0]} ${distKmStr}</div>` : ''}
    `;

    card.addEventListener('click', () => {
      if (selectedNames.has(proj.name)) selectedNames.delete(proj.name);
      else selectedNames.add(proj.name);
      document.getElementById('select-count-text').textContent = selectedNames.size;
      applyFilters();
      map.flyTo([proj.lat, proj.lng], 15, { duration: 1 });
    });

    container.appendChild(card);
  });
}
</script>
</body>
</html>
